<svg xmlns='http://www.w3.org/2000/svg' width='760' height='320' viewBox='0 0 760 320'><rect width='760' height='320' rx='10' fill='#1f2328'/><text x='24.0' y='34.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='17' fill='#e6e8eb' text-anchor='start' font-weight='bold'>When does the block or dodge start?</text><rect x='24' y='52' width='14' height='14' rx='3' fill='#d9a441'/><text x='44.0' y='64.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' fill='#9aa3ad' text-anchor='start' font-weight='normal'>swing</text><rect x='99' y='52' width='14' height='14' rx='3' fill='#7d8590'/><text x='119.0' y='64.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' fill='#9aa3ad' text-anchor='start' font-weight='normal'>wait</text><rect x='167' y='52' width='14' height='14' rx='3' fill='#4fa3e0'/><text x='187.0' y='64.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' fill='#9aa3ad' text-anchor='start' font-weight='normal'>block or dodge</text><circle cx='312' cy='59' r='6' fill='#e5534b'/><text x='325.0' y='64.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' fill='#9aa3ad' text-anchor='start' font-weight='normal'>the swing's hit</text><text x='24.0' y='120.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' fill='#9aa3ad' text-anchor='start' font-weight='normal'>Early cancel</text><rect x='150.0' y='104' width='136.8' height='22' rx='4' fill='#d9a441'/><rect x='286.8' y='104' width='68.4' height='22' rx='4' fill='#7d8590'/><rect x='355.2' y='104' width='364.8' height='22' rx='4' fill='#4fa3e0'/><circle cx='492.0' cy='115' r='7' fill='none' stroke='#e5534b' stroke-width='2' stroke-dasharray='3 2'/><text x='150.0' y='151.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' fill='#e6e8eb' text-anchor='start' font-weight='normal'>Cancel at 0.4 s, block or dodge at 0.6 s. That's before the hit, so the hit is stopped.</text><text x='24.0' y='210.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' fill='#9aa3ad' text-anchor='start' font-weight='normal'>Late cancel</text><rect x='150.0' y='194' width='273.6' height='22' rx='4' fill='#d9a441'/><rect x='423.6' y='194' width='136.8' height='22' rx='4' fill='#7d8590'/><rect x='560.4' y='194' width='159.6' height='22' rx='4' fill='#4fa3e0'/><circle cx='492.0' cy='205' r='7' fill='#e5534b' stroke='#1f2328' stroke-width='2'/><text x='150.0' y='241.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' fill='#e6e8eb' text-anchor='start' font-weight='normal'>Cancel at 0.8 s, block or dodge at 1.2 s. The hit at 1.0 s lands during the wait, at 75% damage.</text><line x1='150' y1='275' x2='720' y2='275' stroke='#3a4048' stroke-width='1.5'/><line x1='150.0' y1='270' x2='150.0' y2='280' stroke='#9aa3ad'/><text x='150.0' y='297.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' fill='#9aa3ad' text-anchor='middle' font-weight='normal'>0.0 s</text><line x1='286.8' y1='270' x2='286.8' y2='280' stroke='#9aa3ad'/><text x='286.8' y='297.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' fill='#9aa3ad' text-anchor='middle' font-weight='normal'>0.4 s</text><line x1='355.2' y1='270' x2='355.2' y2='280' stroke='#9aa3ad'/><text x='355.2' y='297.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' fill='#9aa3ad' text-anchor='middle' font-weight='normal'>0.6 s</text><line x1='423.6' y1='270' x2='423.6' y2='280' stroke='#9aa3ad'/><text x='423.6' y='297.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' fill='#9aa3ad' text-anchor='middle' font-weight='normal'>0.8 s</text><line x1='492.0' y1='270' x2='492.0' y2='280' stroke='#9aa3ad'/><text x='492.0' y='297.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' fill='#e5534b' text-anchor='middle' font-weight='normal'>1.0 s</text><line x1='560.4' y1='270' x2='560.4' y2='280' stroke='#9aa3ad'/><text x='560.4' y='297.0' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' fill='#9aa3ad' text-anchor='middle' font-weight='normal'>1.2 s</text></svg>